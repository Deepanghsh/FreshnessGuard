version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: freshnessguard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - freshnessguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: freshnessguard-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/freshnessguard
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://bifrost:8080/v1}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FRESHNESSGUARD_MODE=${FRESHNESSGUARD_MODE:-${STALEGUARD_MODE:-inline}}
      - STALEGUARD_MODE=${STALEGUARD_MODE:-inline}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://client:80
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - freshnessguard-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: freshnessguard-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - freshnessguard-net

  bifrost:
    image: ghcr.io/maximhq/bifrost:latest
    container_name: freshnessguard-bifrost
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./bifrost-config:/app/config
      - ./plugins:/app/plugins
    environment:
      - BIFROST_CONFIG_PATH=/app/config/config.json
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY:-freshnessguardsecretkey1234567890}
    networks:
      - freshnessguard-net

networks:
  freshnessguard-net:
    driver: bridge

volumes:
  mongodb_data:

