version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: freshnessguard-mongodb
    restart: unless-stopped
    # Internal to Docker network only (unnecessary host port exposure avoided)
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - freshnessguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: freshnessguard-server:1.0.0
    container_name: freshnessguard-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/freshnessguard
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://bifrost:8080/v1}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FRESHNESSGUARD_MODE=${FRESHNESSGUARD_MODE:-inline}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://client:80
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - freshnessguard-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: freshnessguard-client:1.0.0
    container_name: freshnessguard-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - freshnessguard-net

  bifrost:
    image: maximhq/bifrost:v2.5.1
    container_name: freshnessguard-bifrost
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./bifrost-config:/app/config
      - ./plugins:/app/plugins
    environment:
      - BIFROST_CONFIG_PATH=/app/config/config.json
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY:-freshnessguardsecretkey1234567890}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - freshnessguard-net

  # Optional profile for building the Linux .so plugin in an identical Go 1.27 container
  plugin-builder:
    build:
      context: ./plugins/freshnessguard
      dockerfile: Dockerfile
    container_name: freshnessguard-plugin-builder
    volumes:
      - ./plugins:/plugins
    profiles:
      - build-plugin
    networks:
      - freshnessguard-net

networks:
  freshnessguard-net:
    name: freshnessguard-net
    driver: bridge

volumes:
  mongodb_data:
    name: freshnessguard_mongodb_data
