version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: freshnessguard-mongodb
    restart: unless-stopped
    # Internal to Docker network only (unnecessary host port exposure avoided)
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - freshnessguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: freshnessguard-server:1.0.0
    container_name: freshnessguard-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/freshnessguard
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FRESHNESSGUARD_MODE=${FRESHNESSGUARD_MODE:-inline}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://client:80
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - freshnessguard-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: freshnessguard-client:1.0.0
    container_name: freshnessguard-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - freshnessguard-net

  bifrost:
    build:
      context: .
      dockerfile: Dockerfile.bifrost-dynamic
    image: freshnessguard-bifrost:2.5.1-dynamic
    container_name: freshnessguard-bifrost
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./bifrost-config/config.json:/app/data/config.json:ro
      - ./bifrost-config/config.json:/app/config/config.json:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY:?BIFROST_ENCRYPTION_KEY is required}
      - BIFROST_SETUP_TOKEN=${BIFROST_SETUP_TOKEN:?BIFROST_SETUP_TOKEN is required}
      - BIFROST_ADMIN_PASSWORD=${BIFROST_ADMIN_PASSWORD:?BIFROST_ADMIN_PASSWORD is required}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - freshnessguard-net

  # Optional profile for building the Linux .so plugin in an identical Go 1.27 container
  plugin-builder:
    build:
      context: ./plugins/freshnessguard
      dockerfile: Dockerfile
    container_name: freshnessguard-plugin-builder
    volumes:
      - ./plugins:/plugins
    profiles:
      - build-plugin
    networks:
      - freshnessguard-net

networks:
  freshnessguard-net:
    name: freshnessguard-net
    driver: bridge

volumes:
  mongodb_data:
    name: freshnessguard_mongodb_data
